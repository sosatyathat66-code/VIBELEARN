# Render Blueprint for Vibelearn Backend (Inside backend folder)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vibelearn-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
